name: 问题报告
description: 报告可复现的安装、检测或运行问题
title: "[问题]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 Issue，并附上可复现步骤与日志片段。
        不要粘贴账号、序列号、未脱敏的个人路径或安装包本体。

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      description: 包含版本、Build 号与架构
      placeholder: Windows 10 22H2 Build 19045.3803 x64
    validations:
      required: true

  - type: input
    id: powershell
    attributes:
      label: PowerShell 版本
      placeholder: 5.1.19041.3803
    validations:
      required: true

  - type: dropdown
    id: action
    attributes:
      label: 执行的操作
      options:
        - 菜单第 2 项 一键安装 / 修复
        - 菜单第 3 项 自定义安装
        - 菜单第 4 项 修复缺失组件
        - 菜单第 5 项 制作离线安装包
        - 菜单第 6 项 从离线包安装
        - 命令行 InstallOnline
        - 命令行 InstallOffline
        - 其他
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: 涉及组件
      placeholder: Visual C++ 2015-2022 / dotnet35 / DirectPlay
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 双击 GameRuntimeLibrary.cmd
        2. 选择 ...
        3. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 包含错误信息、退出码和界面提示
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志片段
      description: 来自 %ProgramData%\GameRuntimeLibrary\Logs 的最新日志，请先脱敏
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，未找到重复问题
          required: true
        - label: 我已移除日志中的个人路径、账号和序列号
          required: true
